name: Build macOS DMG Installer (ILBERTech Platform v2.1)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  # 1) Apple Silicon (M1 / M2 / M3 / M4) Native Build
  build-macos-apple-silicon:
    name: macOS (Apple Silicon M1/M2/M3/M4)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (arm64)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: "3.11"
          activate-environment: ilber_arm64
          channels: conda-forge

      - name: Install PortAudio & Python Dependencies (arm64)
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge portaudio tk "numpy=1.26.4"
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements_macos.txt
          python -m pip install --force-reinstall --no-deps "numpy==1.26.4"

      - name: Build Apple Silicon .app & .dmg Installer (with Self-Test)
        shell: bash -el {0}
        run: |
          chmod +x BUILD_MACOS_DMG.sh
          ./BUILD_MACOS_DMG.sh "AppleSilicon_M1_M2_M3"

      - name: Upload Apple Silicon macOS .dmg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ILBERTech_v2.1_Mac_AppleSilicon_M1_M2_M3_DMG
          path: ILBERTech_Platform_v2.1_Mac_AppleSilicon_M1_M2_M3_Setup.dmg
          retention-days: 30

  # 2) Intel Mac (x86_64) & Universal Rosetta Build
  build-macos-intel-universal:
    name: macOS (Intel x86_64 & Tüm Macler)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rosetta 2 for x86_64 Emulation
        run: |
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true

      - name: Set up Python 3.11 (Intel x86_64 via osx-64 Conda)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          architecture: x86_64
          python-version: "3.11"
          activate-environment: ilber_intel
          channels: conda-forge

      - name: Install PortAudio & Python Dependencies (Intel x86_64)
        shell: bash -el {0}
        run: |
          CONDA_SUBDIR=osx-64 conda install -y -c conda-forge python=3.11 portaudio tk "numpy=1.26.4" scipy pillow lxml
          arch -x86_64 python -m pip install --upgrade pip
          arch -x86_64 python -m pip install --prefer-binary -r requirements_macos.txt
          arch -x86_64 python -m pip install --force-reinstall --no-deps "numpy==1.26.4"

      - name: Build Intel x86_64 .app & .dmg Installer (with Self-Test)
        shell: bash -el {0}
        run: |
          chmod +x BUILD_MACOS_DMG.sh
          arch -x86_64 ./BUILD_MACOS_DMG.sh "Intel_ve_Tum_Macler"

      - name: Upload Intel / Universal macOS .dmg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ILBERTech_v2.1_Mac_Intel_ve_Tum_Macler_DMG
          path: ILBERTech_Platform_v2.1_Mac_Intel_ve_Tum_Macler_Setup.dmg
          retention-days: 30
